name: update-prices
on:
  schedule:
    - cron: "30 7 * * 1-5"   # 한국시간 평일 16:30 (국내 장 마감 후)
    - cron: "0 22 * * 0-4"   # 한국시간 평일 07:00 (미국 장 마감 후)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance
      - run: python fetch_prices.py
      - run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || (git commit -m "update prices" && git push)
